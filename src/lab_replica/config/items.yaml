# MEASUREMENTS OF THE TWELVE ITEMS of the PDDL problems.
#
# The key is the item's PDDL name; its Gazebo model is the same name with
# '-' replaced by '_'. `kind` selects the shape, defined in
# lab_replica/objects/<kind>.py (collision shapes, grasps, visual mesh);
# the keys each kind needs are listed in that file's docstring.
#
# After changing anything here run
#     ros2 run lab_replica replan_problem.py all_on_table
#
# Units: metres, kg; colours are RGB in [0, 1].
# Sizes MEASURED in the lab (2026-10-13), except the green tape roll, the
# spray bottle's proportions (only its height and width were measured) and the
# mug's handle, which are still ESTIMATED FROM PHOTOS. Masses are guesses.
#
# stable_poses: how the item may rest on the table (upright, lying, flat).

red-can:
  kind: can
  diameter: 0.055
  height: 0.145
  mass: 0.35                # full can
  color: [0.78, 0.04, 0.05]
  stable_poses: [upright, lying]

red-spray-bottle:
  kind: spray_bottle
  # Measured: 0.27 m tall in all (body + neck + head), 0.115 m at its widest.
  body_width: 0.115         # across the label, at the bottom (the body tapers upwards)
  body_depth: 0.068
  body_height: 0.200
  neck_diameter: 0.032
  neck_height: 0.015
  head_width: 0.036         # trigger head (wrapped in grey tape in the lab); it is grasped across this
  head_length: 0.075        # along the nozzle
  head_height: 0.055
  head_offset: 0.012        # head centre ahead of the body axis, towards the nozzle
  mass: 0.30
  color: [0.85, 0.12, 0.10]
  head_color: [0.42, 0.43, 0.45]
  stable_poses: [upright]

roll-of-black-tape:
  kind: tape_roll
  outer_diameter: 0.105
  inner_diameter: 0.075     # 15 mm of tape on the core
  width: 0.025              # height of the roll lying flat
  mass: 0.13
  color: [0.06, 0.06, 0.07]
  stable_poses: [flat]

roll-of-green-tape:
  kind: tape_roll
  outer_diameter: 0.082
  inner_diameter: 0.060
  width: 0.020
  mass: 0.07
  color: [0.05, 0.30, 0.15]
  stable_poses: [flat]

roll-of-blue-tape:
  kind: tape_roll
  outer_diameter: 0.087
  inner_diameter: 0.077     # 5 mm of tape on the core
  width: 0.048
  core: printed             # duct tape: inside printed blue/white (others: cardboard core)
  mass: 0.06
  color: [0.05, 0.12, 0.45]
  stable_poses: [flat]

blue-cup-with-yellow-stripe:
  kind: cup
  top_diameter: 0.067
  waist_diameter: 0.052     # straight lower part
  waist_height: 0.060       # height where the flare starts
  height: 0.120
  stripe: [0.037, 0.055]    # height range of the yellow tape band (visual)
  wall: 0.003
  mass: 0.06
  color: [0.05, 0.08, 0.25]
  stripe_color: [0.95, 0.80, 0.10]
  stable_poses: [upright]

green-mug:
  kind: mug
  top_diameter: 0.075
  bottom_diameter: 0.065
  height: 0.090
  wall: 0.003
  handle_reach: 0.026       # how far the handle sticks out of the body
  handle_height: 0.055
  handle_thickness: 0.010
  mass: 0.08
  color: [0.55, 0.78, 0.12]
  handle_color: [0.85, 0.86, 0.80]
  stable_poses: [upright]

yellow-block:
  kind: block
  size: 0.05                # edge length of the cube
  mass: 0.075
  color: [0.93, 0.78, 0.12]
  stable_poses: [flat]

orange-block:
  kind: block
  size: 0.04
  mass: 0.038
  color: [0.88, 0.36, 0.08]
  stable_poses: [flat]

blue-block:
  kind: block
  size: 0.05
  mass: 0.075
  color: [0.08, 0.12, 0.38]
  stable_poses: [flat]

red-block:
  kind: block
  size: 0.05
  mass: 0.075
  color: [0.82, 0.08, 0.08]
  stable_poses: [flat]

green-block:
  kind: block
  size: 0.05
  mass: 0.075
  color: [0.05, 0.45, 0.15]
  stable_poses: [flat]
